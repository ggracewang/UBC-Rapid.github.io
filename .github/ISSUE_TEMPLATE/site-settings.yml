# The form used to change the website's links and settings.
#
# Open it with the "Edit site settings" link in the pinned "📌 Site settings"
# issue: that link fills in every box with its current value. When the form is
# submitted, .github/workflows/site-settings-request.yml opens a pull request.
#
# Each label below must match a label in .github/scripts/update-site-config.js,
# because that's how the submitted form is read.

name: Update site settings
description: Change the website's links and settings. Open this from the "Edit site settings" link in the pinned Site settings issue, so the current values are filled in.
title: "Update site settings"
labels: ["site-settings"]
body:

  - type: markdown
    attributes:
      value: |
        ## Update site settings

        Every box below shows the **current value**. Change only the ones you want, then click **Create** at the bottom.

        - **Links:** paste the full link, for example `https://www.instagram.com/ubc_rapid/`.
        - **Leaving a box as it is** keeps the current value. An empty box also keeps the current value.

        After you submit, a pull request with your changes is opened automatically and linked in a comment here. Once someone reviews and merges it, run **Deploy to GitHub Pages** in the Actions tab to update the live site.

  # ---------- Join Us page ----------

  - type: dropdown
    id: applications
    attributes:
      label: Applications (Join Us page)
      description: Choose Open to show the application form on the Join Us page.
      options:
        - Open
        - Closed
    validations:
      required: false

  - type: input
    id: application_year
    attributes:
      label: Application year (Join Us page)
      placeholder: "2027/28"
    validations:
      required: false

  - type: input
    id: application_form
    attributes:
      label: Application form link (Join Us page)
    validations:
      required: false

  # ---------- Modelling Service page ----------

  - type: input
    id: modelling_form
    attributes:
      label: Request Now form link (Modelling Service page)
    validations:
      required: false

  # ---------- Footer (every page) ----------

  - type: input
    id: facebook
    attributes:
      label: Facebook link (footer)
    validations:
      required: false

  - type: input
    id: instagram
    attributes:
      label: Instagram link (footer)
    validations:
      required: false

  - type: input
    id: linkedin
    attributes:
      label: LinkedIn link (footer)
    validations:
      required: false

  # ---------- Home page ----------

  - type: input
    id: linktree
    attributes:
      label: Contact Us / Linktree link (home page)
    validations:
      required: false

  - type: input
    id: sponsorship_package
    attributes:
      label: Sponsorship Package link (home page)
    validations:
      required: false

  - type: input
    id: donate_organizations
    attributes:
      label: Donation link for organizations (home page)
    validations:
      required: false

  - type: input
    id: donate_individuals
    attributes:
      label: Donation link for individuals (home page)
    validations:
      required: false
