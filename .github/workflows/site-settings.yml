# Lets team members see and change the links and settings in
# src/siteConfig.json from the Actions tab, without editing code.
#
# Click "Run workflow":
#   - To see the current settings, leave everything as it is and run it.
#     The run's page shows every setting in a table.
#   - To change settings, fill in only the boxes you want to change and run
#     it. Blank boxes keep their current value.
#
# Changes never go to main directly: they open a pull request for someone to
# review. After that's merged, run "Deploy to GitHub Pages" to update the site.

name: Site settings


on:
  workflow_dispatch:
    inputs:

      # ---------- How to use ----------

      # Not a setting: GitHub's form can't show plain text, so this one-option
      # dropdown is a way to put instructions at the top. The script ignores it.
      how_to_use:
        description: 'How to use: fill in only what you want to change. To see the current settings, run without changing anything.'
        type: choice
        options:
          - Got it
        default: Got it

      # ---------- Join Us page ----------

      applications_open:
        description: 'Are applications open or closed? (Join Us page)'
        type: choice
        options:
          - Leave as is
          - Open applications
          - Close applications
        default: Leave as is

      application_year:
        description: 'Application year, e.g. 2027/28 (Join Us page)'
        type: string
        required: false

      application_form:
        description: 'Application form link (Join Us page)'
        type: string
        required: false

      # ---------- Modelling Service page ----------

      modelling_form:
        description: 'Modelling Service request form link'
        type: string
        required: false

      # ---------- Footer (every page) ----------

      facebook:
        description: 'Facebook link (footer)'
        type: string
        required: false

      instagram:
        description: 'Instagram link (footer)'
        type: string
        required: false

      linkedin:
        description: 'LinkedIn link (footer)'
        type: string
        required: false

      # ---------- Home page ----------

      linktree:
        description: 'Contact Us / Linktree link (home page)'
        type: string
        required: false

      sponsorship_package:
        description: 'Sponsorship Package link (home page)'
        type: string
        required: false

      donate_organizations:
        description: 'Donation link for organizations (home page)'
        type: string
        required: false

      donate_individuals:
        description: 'Donation link for individuals (home page)'
        type: string
        required: false


permissions:
  contents: write
  pull-requests: write


# Only one settings update at a time, so two people's changes can't clash
concurrency:
  group: site-settings
  cancel-in-progress: false


jobs:
  settings:
    runs-on: ubuntu-latest

    steps:

      # Always start from main, even if another branch is picked in the form
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Form values are passed as environment variables instead of being
      # written into the command, so nothing typed in a box can run as code
      - name: Show or update settings
        id: update
        env:
          SETTING_APPLICATIONS_OPEN: ${{ inputs.applications_open }}
          SETTING_APPLICATION_YEAR: ${{ inputs.application_year }}
          SETTING_APPLICATION_FORM: ${{ inputs.application_form }}
          SETTING_MODELLING_FORM: ${{ inputs.modelling_form }}
          SETTING_FACEBOOK: ${{ inputs.facebook }}
          SETTING_INSTAGRAM: ${{ inputs.instagram }}
          SETTING_LINKEDIN: ${{ inputs.linkedin }}
          SETTING_LINKTREE: ${{ inputs.linktree }}
          SETTING_SPONSORSHIP_PACKAGE: ${{ inputs.sponsorship_package }}
          SETTING_DONATE_ORGANIZATIONS: ${{ inputs.donate_organizations }}
          SETTING_DONATE_INDIVIDUALS: ${{ inputs.donate_individuals }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          CHANGES_SUMMARY_FILE: ${{ runner.temp }}/changes-summary.md
        run: node .github/scripts/update-site-config.js

      # Only runs if something was filled in and it actually changed a setting
      - name: Open a pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: site-settings/run-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          # Commit the change on a new branch as the GitHub Actions bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add src/siteConfig.json
          git commit -m "chore: update site settings"
          git push origin "$BRANCH"

          # Open the pull request into main
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "chore: update site settings" --body-file "$RUNNER_TEMP/pr-body.md")

          # Write the run's summary page: the pull request link first, then the table
          {
            echo "## ✅ Your change is ready for review"
            echo ""
            echo "A pull request was created with your change. It will appear on the website once the web dev team reviews and publishes it."
            echo ""
            echo "### [View pull request]($PR_URL)"
            echo ""
            echo "**Next step:** let the web dev team know on Slack so they can review it."
            echo ""
            echo "### Your changes"
            echo ""
            cat "$RUNNER_TEMP/changes-summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
