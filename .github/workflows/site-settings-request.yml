# Handles a submitted "Update site settings" form (an issue with the
# site-settings label).
#
# It checks the changes, opens a pull request with them, comments the link on
# the issue, and closes the issue. It never changes main directly. Requests
# from people who aren't on the team are closed without changing anything.

name: Process site settings request


on:
  issues:
    types:
      - opened


permissions:
  contents: write
  pull-requests: write
  issues: write


# Only one request at a time, so two people's changes can't clash
concurrency:
  group: site-settings
  cancel-in-progress: false


jobs:

  # Anyone can open an issue on a public repo, so only team members' requests count
  reject:
    if: >-
      contains(github.event.issue.labels.*.name, 'site-settings') &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Close the request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body "Only UBC Rapid team members can change site settings, so this request was closed without changing anything."
          gh issue close "$NUMBER" --reason "not planned"


  update:
    if: >-
      contains(github.event.issue.labels.*.name, 'site-settings') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}

    steps:

      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The form is passed as an environment variable instead of being written
      # into the command, so nothing typed in a box can run as code
      - name: Read the form and update siteConfig.json
        id: update
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUESTED_BY: ${{ github.event.issue.user.login }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
          CHANGES_FILE: ${{ runner.temp }}/changes.md
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: node .github/scripts/update-site-config.js --from-issue

      # Something in the form needs fixing
      - name: Explain what to fix
        if: steps.update.outputs.result == 'problems'
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUMBER" --reason "not planned"

      # Everything already matched the current settings
      - name: Explain nothing changed
        if: steps.update.outputs.result == 'unchanged'
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUMBER" --reason "not planned"

      - name: Open a pull request
        if: steps.update.outputs.result == 'changed'
        run: |
          BRANCH="site-settings/issue-$NUMBER"

          # Commit the change on a new branch as the GitHub Actions bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add src/siteConfig.json
          git commit -m "chore: update site settings"
          git push origin "$BRANCH"

          # Open the pull request into main
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "chore: update site settings" --body-file "$RUNNER_TEMP/pr-body.md")

          # Tell the person where their pull request is, then close the request
          {
            echo "✅ **A pull request with your changes was opened:** $PR_URL"
            echo ""
            cat "$RUNNER_TEMP/changes.md"
            echo ""
            echo "Next: ask someone to review and merge it, then run **Deploy to GitHub Pages** in the Actions tab."
          } > "$RUNNER_TEMP/done.md"
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/done.md"
          gh issue close "$NUMBER" --reason "completed"

      # Anything else, like the script crashing, still gets a reply
      - name: Report an unexpected error
        if: failure() || (steps.update.outcome == 'failure' && steps.update.outputs.result == '')
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUMBER" --body "Something went wrong while processing this request, so it may not have been applied. Details: $RUN_URL"
